services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fitapp-db
    environment:
      POSTGRES_USER: fitapp
      POSTGRES_PASSWORD: fitapp
      POSTGRES_DB: fitapp
    ports:
      - "5433:5432"
    volumes:
      - fitapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitapp -d fitapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    container_name: fitapp-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fitapp:fitapp@db:5432/fitapp?schema=public
      # Locally the pooled and direct URLs are the same Postgres.
      DIRECT_URL: postgresql://fitapp:fitapp@db:5432/fitapp?schema=public
      DATASET_PATH: /dataset/data/exercises.json
      DATASET_ROOT: /dataset
      PORT: "3001"
      # dev-only secret; override in any real deployment
      JWT_SECRET: dev-secret-change-me
      # Optional: enables "Sign in with Google". Put the OAuth client ID in a
      # .env file next to this compose file (see README). Empty = feature off.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Rate limiting: override from the .env file next to this compose file
      # (see .env.example). Empty = the defaults baked into the API.
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-}
      MEDIA_RATE_LIMIT_MAX: ${MEDIA_RATE_LIMIT_MAX:-}
      MEDIA_RATE_LIMIT_WINDOW: ${MEDIA_RATE_LIMIT_WINDOW:-}
      PLAN_RATE_LIMIT_MAX: ${PLAN_RATE_LIMIT_MAX:-}
      PLAN_RATE_LIMIT_WINDOW: ${PLAN_RATE_LIMIT_WINDOW:-}
      # No proxy in front of the API locally, so req.ip is already the client.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WEBHOOK_RATE_LIMIT_MAX: ${WEBHOOK_RATE_LIMIT_MAX:-}
      # Subscriptions: admins and the manual-qr account details (see
      # .env.example). Without QR_ACCOUNT_NUMBER + QR_CONTACT the provider stays
      # disabled and the plans screen shows no way to pay.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CLOSED_BETA: ${CLOSED_BETA:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      PAYMENT_PENDING_HOURS: ${PAYMENT_PENDING_HOURS:-}
      QR_BANK_NAME: ${QR_BANK_NAME:-}
      QR_ACCOUNT_NAME: ${QR_ACCOUNT_NAME:-}
      QR_ACCOUNT_NUMBER: ${QR_ACCOUNT_NUMBER:-}
      QR_IMAGE_URL: ${QR_IMAGE_URL:-}
      QR_CONTACT: ${QR_CONTACT:-}
      # Polar stays off until all three are set (see .env.example).
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_PRODUCT_ID_PRO: ${POLAR_PRODUCT_ID_PRO:-}
      POLAR_SUCCESS_URL: ${POLAR_SUCCESS_URL:-}
    ports:
      - "3001:3001"
    volumes:
      # dataset (media + json) mounted read-only from the sibling repo
      - ../exercises-dataset:/dataset:ro
      # source mounts for hot reload (node_modules stays from the image)
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
      - ./apps/api/data:/app/data:ro

  web:
    build: ./apps/web
    container_name: fitapp-web
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3001
      # Sin número no se pinta el botón de "pedir invitación", solo el texto.
      VITE_INVITE_WHATSAPP: ${VITE_INVITE_WHATSAPP:-}
    ports:
      - "5174:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts

volumes:
  fitapp-db-data:
