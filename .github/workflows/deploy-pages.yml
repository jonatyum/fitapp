name: Deploy web to GitHub Pages

# Builds apps/web and publishes it to GitHub Pages.
# Requires:
#   - Settings → Pages → Source = "GitHub Actions"
#   - Settings → Secrets and variables → Actions → Variables:
#       VITE_API_URL = https://<your-render-service>.onrender.com
#   - Settings → Pages → Custom domain = chamani.jonatyum.com, with a
#     CNAME chamani → jonatyum.github.io in Cloudflare (DNS only).
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # No VITE_BASE: on the custom domain the app is served from the root,
          # so vite.config's default of "/" is the right one.
      # Pages has no SPA fallback: without this, reloading /routine 404s.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
